name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # Trusted Publishing (OIDC) に必須

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish   # protected environment、承認ゲート
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # Trusted Publishing要件: npm CLI >=11.5.1 / Node >=22.14.0
                                 # runtime本体の互換契約(Node>=20)とは別物、混同しない
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag($TAG_VERSION) != package.json version($PKG_VERSION)"
            exit 1
          fi
      - run: npm publish
